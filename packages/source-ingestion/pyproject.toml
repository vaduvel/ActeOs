[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wb-source-ingestion"
version = "0.1.0"
description = "Safe source registry, bounded fetcher, immutable snapshots, and content lifecycle for Waze pentru birocratie."
requires-python = ">=3.13"
dependencies = [
    "wb-contracts",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]
